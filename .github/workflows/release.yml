name: Release desktop installers

# Builds double-clickable Kairos installers for macOS, Windows, and Linux and
# uploads them to a GitHub Release — so users can just download and run, no
# git clone / npm required. Free GitHub-hosted runners; no code-signing (users
# get a one-time "unidentified developer" / SmartScreen prompt). Signing is
# drop-in later: add the secrets and uncomment the `env:` block in the build job.
#
# Trigger: push a version tag (e.g. `git tag v0.1.0-rc1 && git push origin v0.1.0-rc1`)
# or run manually from the Actions tab (workflow_dispatch). First runs publish a
# DRAFT release so the artifacts can be inspected before going public.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v0.1.0-rc1)'
        required: true
        default: 'v0.0.0-dev'

# tauri-action creates the release and uploads assets, so the job needs write
# access to repository contents.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      # Keep every platform running even if one fails — we want to see which
      # bundles work on the first-ever compile of the Rust/Tauri shell.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - label: macOS (Intel)
            os: macos-13
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - label: Windows (x64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ''
          - label: Linux (x64)
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Cache the Rust build artifacts per platform so re-runs are fast. Keyed on
      # the src-tauri crate so a dependency change busts it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      # Tauri v2 on Linux needs webkit2gtk 4.1 and friends to build the webview.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file

      # Install workspace JS dependencies from the committed lockfile. The Tauri
      # build's beforeBuildCommand (prepare-bundle.sh) then runs `npm run build`,
      # bundles the server, and stages the UI — no duplicate build logic here.
      - name: Install workspace dependencies
        run: npm ci

      - name: Build and release Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing (optional, add later) --------------------------------
          # macOS notarization + signing:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing (for silent auto-update artifacts):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          # Tag comes from the pushed tag, or the manual workflow_dispatch input.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Kairos ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Download the installer for your OS below, then double-click it.

            - **macOS**: `.dmg` — first launch is unsigned, so right-click the app → **Open**.
            - **Windows**: `.msi` or `.exe` — if SmartScreen warns, click **More info → Run anyway**.
            - **Linux**: `.deb` (`sudo apt install ./Kairos_*.deb`) or the portable `.AppImage`.

            Requires **Node.js 20+** on the target machine — Kairos runs a local Node server for its backend.
          # First runs stay a DRAFT so we can inspect the artifacts before they go
          # public. Flip to false once all platforms build green.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
