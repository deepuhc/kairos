<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="aqua" x1="120" y1="100" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ac8fa"/>
      <stop offset="50%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile — soft white like macOS app icon -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#tile)"/>
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="3"/>

  <!-- Stylized K mark in aqua gradient -->
  <g fill="none" stroke="url(#aqua)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <line x1="168" y1="120" x2="168" y2="392"/>
    <line x1="168" y1="256" x2="328" y2="120"/>
    <line x1="168" y1="256" x2="344" y2="392"/>
  </g>

  <!-- Motion arc -->
  <path d="M340,140 A140,140 0 0,1 370,300" fill="none" stroke="url(#aqua)" stroke-width="20" stroke-linecap="round" opacity="0.4"/>

  <!-- Flare at intersection -->
  <circle cx="168" cy="256" r="32" fill="url(#aqua)"/>
  <circle cx="168" cy="256" r="14" fill="#ffffff" opacity="0.4"/>

  <!-- Dots at tips -->
  <circle cx="328" cy="120" r="18" fill="url(#aqua)"/>
  <circle cx="344" cy="392" r="18" fill="url(#aqua)"/>
  <circle cx="370" cy="300" r="14" fill="url(#aqua)" opacity="0.6"/>
</svg>
