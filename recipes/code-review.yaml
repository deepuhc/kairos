name: "Parallel Code Review"
description: "Multi-perspective code review with synthesis"
domain: software-development
version: 1
audience: developer

providers:
  default: anthropic/claude-sonnet-4-6
  complex: anthropic/claude-opus-4-6
  fast: ollama/llama3.2

budget:
  max_cost: 2.00
  fallback_on_budget: ollama/llama3.2
  warn_at_percent: 80

security:
  dataClassification: internal
  cloudAllowed: true

agents:
  - id: security-reviewer
    role: "Scan for security vulnerabilities (OWASP Top 10, injection, auth issues)"
    model: ${providers.default}
    tools: [grep, read, glob]
    permissions:
      fileAccess: read-only

  - id: logic-reviewer
    role: "Check for logic errors, edge cases, and correctness issues"
    model: ${providers.default}
    tools: [grep, read, glob]
    permissions:
      fileAccess: read-only

  - id: style-reviewer
    role: "Review code style, maintainability, and adherence to conventions"
    model: ${providers.fast}
    tools: [grep, read]
    permissions:
      fileAccess: read-only

  - id: synthesizer
    role: "Combine all reviews into a prioritized, actionable summary"
    model: ${providers.complex}
    tools: [read, write]
    permissions:
      fileAccess: write
      paths: ["./review-output/"]

pipeline:
  - phase: review
    pattern: parallel
    agents: [security-reviewer, logic-reviewer, style-reviewer]
    timeout: 5m

  - phase: synthesize
    pattern: sequential
    agents: [synthesizer]
    gate:
      type: quality
      check: "all reviews completed without errors"

  - phase: iterate
    pattern: loop
    condition: "synthesizer.confidence < 0.8"
    max_iterations: 2
    agents: [logic-reviewer, synthesizer]
